[package]
name = "forge-m365"
description = "Facade crate for the forge-m365 SDK: full Microsoft 365 surface (Graph + SharePoint REST)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
forge-m365-core = { path = "../forge-m365-core", version = "0.1.0" }
forge-m365-auth = { path = "../forge-m365-auth", version = "0.1.0" }
forge-m365-macros = { path = "../forge-m365-macros", version = "0.1.0" }
forge-m365-sp-sites = { path = "../forge-m365-sp-sites", version = "0.1.0" }
forge-m365-sp-webs = { path = "../forge-m365-sp-webs", version = "0.1.0" }
forge-m365-sp-lists = { path = "../forge-m365-sp-lists", version = "0.1.0" }
forge-m365-sp-files = { path = "../forge-m365-sp-files", version = "0.1.0" }
forge-m365-sp-search = { path = "../forge-m365-sp-search", version = "0.1.0" }
forge-m365-sp-site-users = { path = "../forge-m365-sp-site-users", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
